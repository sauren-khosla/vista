name: Build release installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: swift test
      - name: Build universal preview installer
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vista-universal-preview
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
